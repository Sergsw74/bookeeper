[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "archive-downloader"
version = "0.1.0"
description = "Automated arXiv and scientific article downloader with pagination, indexing, deduplication, and Calibre-compatible metadata."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
    { name = "Bookeeper Contributors" }
]
dependencies = [
    "httpx>=0.27.0",
    "beautifulsoup4>=4.12.0",
    "pydantic>=2.7.0",
    "typer>=0.12.0",
    "rich>=13.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
]

[project.scripts]
archive-downloader = "archive_downloader.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/archive_downloader"]
