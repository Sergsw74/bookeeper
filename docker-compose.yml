services:
  bookeeper:
    image: 192.168.50.20:5000/bookeeper:latest
    build:
      context: .
      dockerfile: Dockerfile
    container_name: bookeeper
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - BOOKEEPER_HOST=0.0.0.0
      - BOOKEEPER_PORT=8000
      - BOOKEEPER_CONFIG=/app/config.yaml
      - BOOKEEPER_BOOKS_DIR=/app/archive_downloader/downloads
      - BOOKEEPER_OUTPUT_DIR=/app/output
      # Optional Ollama / Neo4j overrides:
      # - BOOKEEPER_OLLAMA_BASE_URL=http://192.168.50.118:11434
      # - BOOKEEPER_NEO4J_URI=bolt://neo4j:7687
      # - BOOKEEPER_NEO4J_USER=neo4j
      # - BOOKEEPER_NEO4J_PASSWORD=password
    volumes:
      # Mount configuration file
      - ${BOOKEEPER_CONFIG_FILE:-./config.yaml}:/app/config.yaml:ro
      # Knowledge artifacts (graph, embeddings, obsidian vault, chunks, checkpoints)
      - ${BOOKEEPER_DATA_DIR:-./output}:/app/output
      # Source books and papers (can point to host download folder or disk mount)
      - ${BOOKEEPER_BOOKS_DIR:-./archive_downloader/downloads}:/app/archive_downloader/downloads
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

  # Optional Neo4j graph database service (uncomment if you wish to run Neo4j locally on the server)
  # neo4j:
