[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "bookeeper"
version = "0.1.0"
description = "Calibre library ingester, LLM metadata normalizer, and concept knowledge graph extractor using local Ollama."
readme = "README.md"
authors = [
    { name = "Bookeeper Contributors" }
]
license = { text = "MIT" }
requires-python = ">=3.10"
keywords = ["calibre", "ollama", "knowledge-graph", "epub", "pdf", "langchain", "obsidian", "networkx"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Information Analysis",
    "Topic :: Text Processing :: General",
]
dependencies = [
    "typer>=0.12.0",
    "rich>=13.7.0",
    "pydantic>=2.7.0",
    "pydantic-settings>=2.2.0",
    "pyyaml>=6.0.1",
    "networkx>=3.2.1",
    "ebooklib>=0.18",
    "beautifulsoup4>=4.12.3",
    "pypdf>=4.2.0",
    "httpx>=0.27.0",
    "langchain-core>=0.2.0",
    "langchain-ollama>=0.1.0",
    "numpy>=1.26.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=5.0.0",
    "ruff>=0.4.0",
    "mypy>=1.10.0",
]

[project.scripts]
bookeeper = "bookeeper.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/bookeeper"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP", "B"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra -q"
